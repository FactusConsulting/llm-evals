id: AG18
tier: 2
title: "Debug a shell script"
difficulty: medium
time_limit: 300
max_steps: 30
min_steps: 4

goal: |
  The backup script at /tmp/ageval/backup.sh fails silently. It has 3 bugs:
  1. An unquoted variable that breaks when paths contain spaces
  2. A wrong comparison operator (using = instead of -gt for numeric comparison)
  3. Missing error handling (no set -e or explicit exit on failure)
  Fix all 3 bugs so the script runs successfully and creates the backup.

setup: |
  rm -rf /tmp/ageval
  mkdir -p "/tmp/ageval/source dir"
  mkdir -p /tmp/ageval/backups
  echo "important data" > "/tmp/ageval/source dir/file1.txt"
  echo "more data" > "/tmp/ageval/source dir/file2.txt"
  cat > /tmp/ageval/backup.sh << 'BASH'
  #!/bin/bash

  BACKUP_SRC=/tmp/ageval/source dir
  BACKUP_DST=/tmp/ageval/backups
  MAX_BACKUPS=5

  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
  BACKUP_NAME="backup_${TIMESTAMP}.tar.gz"

  tar czf ${BACKUP_DST}/${BACKUP_NAME} -C ${BACKUP_SRC} .

  COUNT=$(ls -1 ${BACKUP_DST}/backup_*.tar.gz 2>/dev/null | wc -l)
  if [ "$COUNT" = "$MAX_BACKUPS" ]; then
      ls -1t ${BACKUP_DST}/backup_*.tar.gz | tail -n +$((MAX_BACKUPS + 1)) | xargs rm -f
  fi

  echo "Backup complete: ${BACKUP_NAME}"
  BASH
  chmod +x /tmp/ageval/backup.sh

verify: |
  # Run the fixed script
  bash /tmp/ageval/backup.sh 2>&1 | grep -q "Backup complete" && \
  # Verify a backup was actually created
  ls /tmp/ageval/backups/backup_*.tar.gz 2>/dev/null | head -1 | xargs test -f && \
  # Verify the backup contains the files
  ARCHIVE=$(ls -1t /tmp/ageval/backups/backup_*.tar.gz | head -1) && \
  tar tzf "$ARCHIVE" | grep -q "file1.txt" && \
  # Verify error handling exists
  grep -qE '(set -e|set -o errexit|\|\| exit|\|\| \{)' /tmp/ageval/backup.sh && \
  # Verify the source path variable is properly quoted
  grep -q '".*source dir.*"' /tmp/ageval/backup.sh && \
  # Verify numeric comparison uses -gt or -ge
  grep -qE '\-g[te]' /tmp/ageval/backup.sh

tools:
  - exec
