id: E2E-pdb
title: 'End-to-end: PM-shaped PDB task'
max_steps: 16
goal: "## Task: Add non-blocking PDB for single-replica Loki\nEpic: \nStory: FactusConsulting/product-planning#<n>\nRepo / path: FactusConsulting/infra \u2014 /tmp/nd/e2e\nGoal: Add a PodDisruptionBudget for the single-replica Loki Deployment to prevent logging outages during voluntary disruptions without blocking rolling node drains.\nContext: In /tmp/nd/e2e, loki.yaml defines a single-replica Deployment wired into kustomization.yaml. Currently, there is no PDB, so node drains immediately terminate the only pod, blinding logging. The cluster performs rolling node drains regularly. Mirror the existing kustomization structure when adding the new manifest.\nConstraints:\n- Create a PodDisruptionBudget targeting the Loki Deployment (match the exact label selectors used in loki.yaml).\n- Use `maxUnavailable: 1` to allow drains to proceed.\n- Footgun: A PDB with `minAvailable: 1` on a single-replica Deployment will deadlock rolling node drains. The PDB must explicitly avoid `minAvailable: 1` to prevent blocking maintenance.\nVerify (the dev MUST run this and confirm it passes before finishing):\n- `kustomize build /tmp/nd/e2e | grep -q 'kind: PodDisruptionBudget' && kustomize build /tmp/nd/e2e | grep -q 'maxUnavailable: 1' && ! kustomize build /tmp/nd/e2e | grep -q 'minAvailable: 1'`"
setup: "rm -rf /tmp/nd/e2e && mkdir -p /tmp/nd/e2e\ncat > /tmp/nd/e2e/loki.yaml <<'EOF'\napiVersion: apps/v1\nkind: Deployment\nmetadata: { name: loki, namespace: observability, labels: { app: loki } }\nspec:\n  replicas: 1\n  selector: { matchLabels: { app: loki } }\n  template:\n    metadata: { labels: { app: loki } }\n    spec: { containers: [ { name: loki, image: grafana/loki:3.0.0 } ] }\nEOF\ncat > /tmp/nd/e2e/kustomization.yaml <<'EOF'\napiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources:\n  - loki.yaml\nEOF"
verify: 'out=$(kustomize build /tmp/nd/e2e 2>/dev/null)

  echo "$out" | grep -q ''kind: PodDisruptionBudget'' || exit 1

  echo "$out" | grep -qE ''maxUnavailable: *1'' || exit 1

  echo "$out" | grep -q ''minAvailable'' && exit 1

  exit 0'
tools:
- exec
