id: AG15
tier: 2
title: "Fix a broken Ansible playbook"
difficulty: medium
time_limit: 300
max_steps: 30
min_steps: 4

goal: |
  The Ansible playbook at /tmp/ageval/playbook.yml has 3 syntax errors:
  1. Wrong indentation on a task
  2. A missing colon after a module parameter
  3. An incorrect module name ("copy_file" instead of "copy")
  Fix all 3 errors so that `ansible-playbook --syntax-check playbook.yml` passes.

setup: |
  mkdir -p /tmp/ageval
  cat > /tmp/ageval/playbook.yml << 'EOF'
  ---
  - name: Configure web server
    hosts: localhost
    connection: local
    gather_facts: false

    tasks:
      - name: Install required packages
        ansible.builtin.apt:
          name: nginx
          state: present

        - name: Create config directory
        ansible.builtin.file:
          path: /tmp/ageval/webconfig
          state: directory
          mode: "0755"

      - name: Copy configuration file
        ansible.builtin.copy_file:
          src /tmp/ageval/source.conf
          dest: /tmp/ageval/webconfig/app.conf
          mode: "0644"

      - name: Ensure service is started
        ansible.builtin.debug:
          msg: "Web server configured successfully"
  EOF

verify: |
  cd /tmp/ageval && ansible-playbook --syntax-check playbook.yml 2>&1 | grep -q "playbook: playbook.yml"

tools:
  - exec
