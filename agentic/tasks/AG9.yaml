id: AG9
tier: 1
title: "Parse and transform CSV data"
difficulty: easy
time_limit: 120
max_steps: 10
min_steps: 3

goal: |
  Read /tmp/ageval/users.csv and create /tmp/ageval/emails.txt containing
  only the email addresses, one per line, sorted alphabetically.

setup: |
  mkdir -p /tmp/ageval
  cat > /tmp/ageval/users.csv << 'EOF'
  name,email,role
  Charlie Brown,charlie@example.com,admin
  Alice Smith,alice@example.com,user
  Bob Jones,bob@example.com,editor
  Diana Prince,diana@example.com,user
  EOF

verify: |
  expected="alice@example.com
  bob@example.com
  charlie@example.com
  diana@example.com"
  actual=$(cat /tmp/ageval/emails.txt 2>/dev/null | tr -d '[:blank:]')
  [ "$actual" = "$expected" ]

tools:
  - exec
