id: AG9
tier: 1
title: "Parse and transform CSV data"
difficulty: easy
time_limit: 120
max_steps: 10
min_steps: 3

goal: |
  Read /tmp/ageval/users.csv and create /tmp/ageval/emails.txt containing
  only the email addresses, one per line, sorted alphabetically.

setup: |
  mkdir -p /tmp/ageval
  printf 'name,email,role\nCharlie Brown,charlie@example.com,admin\nAlice Smith,alice@example.com,user\nBob Jones,bob@example.com,editor\nDiana Prince,diana@example.com,user\n' > /tmp/ageval/users.csv

verify: |
  f=/tmp/ageval/emails.txt
  [ -f "$f" ] && \
  grep -q 'alice@example.com' "$f" && \
  grep -q 'bob@example.com' "$f" && \
  grep -q 'charlie@example.com' "$f" && \
  grep -q 'diana@example.com' "$f" && \
  [ "$(grep -c '@example.com' "$f")" = "4" ]

tools:
  - exec
