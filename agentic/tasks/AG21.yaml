id: AG21
tier: 3
title: "Fix a multi-file application"
difficulty: hard
time_limit: 600
max_steps: 50
min_steps: 8

goal: |
  A Python Flask app at /tmp/ageval/webapp/ has bugs in each of its 3 files:
  1. app.py has a wrong import (importing "jsn" instead of "json")
  2. routes.py has a bad route decorator (missing leading slash)
  3. utils.py is missing a return statement in a function
  Fix all 3 bugs so the app starts and GET /health returns HTTP 200 with body "ok".

setup: |
  rm -rf /tmp/ageval/webapp
  mkdir -p /tmp/ageval/webapp
  pip install flask >/dev/null 2>&1 || pip3 install flask >/dev/null 2>&1

  cat > /tmp/ageval/webapp/app.py << 'PYEOF'
  import jsn
  from flask import Flask

  def create_app():
      app = Flask(__name__)
      app.config['SECRET_KEY'] = 'dev-key'

      from routes import register_routes
      register_routes(app)

      return app

  if __name__ == '__main__':
      app = create_app()
      app.run(host='0.0.0.0', port=5111)
  PYEOF

  cat > /tmp/ageval/webapp/routes.py << 'PYEOF'
  from flask import jsonify
  from utils import get_status

  def register_routes(app):
      @app.route("health", methods=["GET"])
      def health():
          status = get_status()
          return status, 200

      @app.route("/info", methods=["GET"])
      def info():
          return jsonify({"version": "1.0.0"}), 200
  PYEOF

  cat > /tmp/ageval/webapp/utils.py << 'PYEOF'
  def get_status():
      status = "ok"

  def format_response(data):
      return {"data": data, "success": True}
  PYEOF

verify: |
  # Start the app in the background
  cd /tmp/ageval/webapp
  pkill -f "python.*app.py.*5111" 2>/dev/null || true
  sleep 0.5
  python3 app.py &
  APP_PID=$!
  sleep 2
  # Check health endpoint
  RESULT=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5111/health 2>/dev/null)
  BODY=$(curl -s http://127.0.0.1:5111/health 2>/dev/null)
  kill $APP_PID 2>/dev/null
  [ "$RESULT" = "200" ] && echo "$BODY" | grep -q "ok"

tools:
  - exec
