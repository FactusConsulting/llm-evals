id: AG2
tier: 1
title: "Find and count files by extension"
difficulty: easy
time_limit: 120
max_steps: 10
min_steps: 2

goal: |
  Count all .yaml and .yml files under /tmp/ageval/project/.
  Write the total count to /tmp/ageval/count.txt.

setup: |
  rm -rf /tmp/ageval/project
  mkdir -p /tmp/ageval/project/{config,deploy,src}
  touch /tmp/ageval/project/config/{app.yaml,db.yaml,cache.yml}
  touch /tmp/ageval/project/deploy/{k8s.yaml,helm.yml,docker-compose.yaml}
  touch /tmp/ageval/project/src/{main.py,test.py}
  touch /tmp/ageval/project/README.md

verify: |
  [ "$(cat /tmp/ageval/count.txt 2>/dev/null | tr -d '[:space:]')" = "6" ]

tools:
  - exec
