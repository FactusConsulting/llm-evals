id: AG13
tier: 2
title: "Fix failing Python tests"
difficulty: medium
time_limit: 300
max_steps: 30
min_steps: 6

goal: |
  The project at /tmp/ageval/project has 3 failing tests. Fix the SOURCE CODE
  (not the tests) to make all tests pass. Do not modify any test files.

setup: |
  rm -rf /tmp/ageval/project
  mkdir -p /tmp/ageval/project
  cat > /tmp/ageval/project/calculator.py << 'PYEOF'
  class Calculator:
      def add(self, a, b):
          return a - b  # BUG: should be a + b

      def multiply(self, a, b):
          return a + b  # BUG: should be a * b

      def divide(self, a, b):
          return a / b  # BUG: should handle division by zero
  PYEOF
  cat > /tmp/ageval/project/test_calculator.py << 'PYEOF'
  from calculator import Calculator

  def test_add():
      c = Calculator()
      assert c.add(2, 3) == 5
      assert c.add(-1, 1) == 0

  def test_multiply():
      c = Calculator()
      assert c.multiply(3, 4) == 12
      assert c.multiply(0, 5) == 0

  def test_divide():
      c = Calculator()
      assert c.divide(10, 2) == 5.0
      assert c.divide(10, 0) is None  # Should return None for div by zero
  PYEOF

verify: |
  cd /tmp/ageval/project && python3 -m pytest test_calculator.py -v 2>&1 | grep -q "3 passed"
  # Also verify tests weren't modified
  md5sum /tmp/ageval/project/test_calculator.py | grep -q "$(md5sum /tmp/ageval/project/test_calculator.py | cut -d' ' -f1)"

tools:
  - exec
