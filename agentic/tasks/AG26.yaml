id: AG26
tier: 3
title: "Harden a Dockerfile"
difficulty: hard
time_limit: 600
max_steps: 50
min_steps: 7

goal: |
  The Dockerfile at /tmp/ageval/docker/Dockerfile has 5 security issues:
  1. Uses "latest" tag instead of a pinned version
  2. Runs as root (no USER instruction)
  3. Copies a secrets file into the image (COPY .env .)
  4. No HEALTHCHECK instruction
  5. No .dockerignore file exists
  Fix all 5 issues. Pin the base image to python:3.11-slim, add a non-root user,
  remove the secrets copy, add a healthcheck, and create a .dockerignore.

setup: |
  rm -rf /tmp/ageval/docker
  mkdir -p /tmp/ageval/docker
  cat > /tmp/ageval/docker/Dockerfile << 'EOF'
  FROM python:latest

  WORKDIR /app

  COPY requirements.txt .
  RUN pip install --no-cache-dir -r requirements.txt

  COPY .env .
  COPY . .

  EXPOSE 8080

  CMD ["python", "app.py"]
  EOF
  cat > /tmp/ageval/docker/requirements.txt << 'EOF'
  flask==3.0.0
  gunicorn==21.2.0
  EOF
  cat > /tmp/ageval/docker/app.py << 'EOF'
  from flask import Flask
  app = Flask(__name__)

  @app.route("/health")
  def health():
      return "ok", 200

  if __name__ == "__main__":
      app.run(host="0.0.0.0", port=8080)
  EOF
  cat > /tmp/ageval/docker/.env << 'EOF'
  DB_PASSWORD=secret123
  API_KEY=key456
  EOF

verify: |
  DF="/tmp/ageval/docker/Dockerfile"
  DI="/tmp/ageval/docker/.dockerignore"
  # 1. No "latest" tag
  ! grep -q "python:latest" "$DF" && \
  # Must use a pinned version
  grep -qE "python:3\.[0-9]+" "$DF" && \
  # 2. Has a USER instruction (non-root)
  grep -q "^USER " "$DF" && \
  ! grep -qi "^USER root" "$DF" && \
  # 3. No secrets copied
  ! grep -q "COPY .env" "$DF" && \
  # 4. Has HEALTHCHECK
  grep -q "^HEALTHCHECK " "$DF" && \
  # 5. .dockerignore exists and excludes .env
  [ -f "$DI" ] && \
  grep -q "\.env" "$DI"

tools:
  - exec
