id: AG4
tier: 1
title: "Git branch and commit info"
difficulty: easy
time_limit: 120
max_steps: 10
min_steps: 4

goal: |
  A git repo exists at /tmp/ageval/repo. Check out the branch "feature/login".
  Write the last commit message from that branch to /tmp/ageval/commit-msg.txt.

setup: |
  rm -rf /tmp/ageval/repo
  mkdir -p /tmp/ageval/repo
  cd /tmp/ageval/repo
  git init
  git config user.email "test@test.com"
  git config user.name "Test"
  git commit --allow-empty -m "Initial commit"
  git checkout -b feature/login
  echo "login code" > login.py
  git add login.py
  git commit -m "feat: add login endpoint with OAuth2 support"
  git checkout -b feature/signup
  echo "signup code" > signup.py
  git add signup.py
  git commit -m "feat: add signup flow"
  git checkout main 2>/dev/null || git checkout master

verify: |
  [ "$(cat /tmp/ageval/commit-msg.txt 2>/dev/null | tr -d '[:space:]')" = "feat:addloginendpointwithOAuth2support" ]

tools:
  - exec
