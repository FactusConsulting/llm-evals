id: AG25
tier: 3
title: "Migrate configuration"
difficulty: hard
time_limit: 600
max_steps: 50
min_steps: 6

goal: |
  Convert the environment variables in /tmp/ageval/app.env into Kubernetes manifests:
  1. Non-sensitive vars go into /tmp/ageval/configmap.yaml (a ConfigMap named "app-config")
  2. Sensitive vars (DB_PASSWORD, API_KEY, SECRET_KEY) go into /tmp/ageval/secret.yaml
     (a Secret named "app-secret" with base64-encoded values)
  Both files must be valid Kubernetes YAML with proper apiVersion, kind, and metadata.

setup: |
  rm -rf /tmp/ageval
  mkdir -p /tmp/ageval
  cat > /tmp/ageval/app.env << 'EOF'
  APP_NAME=myservice
  APP_PORT=8080
  APP_ENV=production
  DB_HOST=db.internal.svc
  DB_PORT=5432
  DB_NAME=appdb
  DB_PASSWORD=s3cret_p@ssw0rd!
  API_KEY=ak_live_7f8g9h0j1k2l3m4n
  SECRET_KEY=super-secret-key-12345
  LOG_LEVEL=info
  MAX_WORKERS=4
  EOF

verify: |
  python3 << 'PYEOF'
  import yaml, base64, sys

  # Check ConfigMap
  with open("/tmp/ageval/configmap.yaml") as f:
      cm = yaml.safe_load(f)
  assert cm["kind"] == "ConfigMap", f"Wrong kind: {cm['kind']}"
  assert cm["metadata"]["name"] == "app-config"
  assert "apiVersion" in cm
  data = cm.get("data", {})
  assert data.get("APP_NAME") == "myservice", f"APP_NAME wrong: {data.get('APP_NAME')}"
  assert data.get("APP_PORT") == "8080" or data.get("APP_PORT") == 8080
  assert "DB_PASSWORD" not in data, "DB_PASSWORD should be in Secret, not ConfigMap"
  assert "API_KEY" not in data, "API_KEY should be in Secret, not ConfigMap"
  assert "SECRET_KEY" not in data, "SECRET_KEY should be in Secret, not ConfigMap"

  # Check Secret
  with open("/tmp/ageval/secret.yaml") as f:
      secret = yaml.safe_load(f)
  assert secret["kind"] == "Secret", f"Wrong kind: {secret['kind']}"
  assert secret["metadata"]["name"] == "app-secret"
  assert "apiVersion" in secret
  sdata = secret.get("data", {})
  assert "DB_PASSWORD" in sdata, "Missing DB_PASSWORD in Secret"
  assert "API_KEY" in sdata, "Missing API_KEY in Secret"
  assert "SECRET_KEY" in sdata, "Missing SECRET_KEY in Secret"
  # Verify base64 encoding
  decoded_pw = base64.b64decode(sdata["DB_PASSWORD"]).decode()
  assert decoded_pw == "s3cret_p@ssw0rd!", f"DB_PASSWORD decoded wrong: {decoded_pw}"
  decoded_key = base64.b64decode(sdata["API_KEY"]).decode()
  assert decoded_key == "ak_live_7f8g9h0j1k2l3m4n", f"API_KEY decoded wrong: {decoded_key}"

  print("PASS")
  PYEOF

tools:
  - exec
