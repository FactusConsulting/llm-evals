id: AG17
tier: 2
title: "Extract and transform data between formats"
difficulty: medium
time_limit: 300
max_steps: 30
min_steps: 3

goal: |
  Convert the CSV file at /tmp/ageval/data.csv to JSON format at /tmp/ageval/data.json.
  The JSON output should be an array of objects where each object represents a row,
  with CSV column headers as keys. Numeric values should be numbers (not strings).

setup: |
  mkdir -p /tmp/ageval
  rm -f /tmp/ageval/data.json
  cat > /tmp/ageval/data.csv << 'EOF'
  name,age,city,score
  Alice,30,New York,95.5
  Bob,25,San Francisco,87.3
  Charlie,35,Chicago,91.0
  Diana,28,Boston,88.7
  Eve,32,Seattle,93.2
  EOF

verify: |
  python3 -c "
  import json, sys
  with open('/tmp/ageval/data.json') as f:
      data = json.load(f)
  assert isinstance(data, list), 'Root must be an array'
  assert len(data) == 5, f'Expected 5 records, got {len(data)}'
  assert data[0]['name'] == 'Alice', f'First name wrong: {data[0]}'
  assert data[0]['age'] == 30 or data[0]['age'] == 30.0, 'age should be numeric'
  assert data[2]['city'] == 'Chicago', 'Third city wrong'
  assert isinstance(data[4]['score'], (int, float)), 'score should be numeric'
  print('PASS')
  "

tools:
  - exec
