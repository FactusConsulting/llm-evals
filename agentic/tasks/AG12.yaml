id: AG12
tier: 2
title: "Resolve git merge conflicts"
difficulty: medium
time_limit: 300
max_steps: 30
min_steps: 6

goal: |
  The git repo at /tmp/ageval/repo has a merge in progress with conflicts in two files.
  Resolve the conflicts by keeping the content from the current branch (ours).
  Complete the merge with a commit message "merge: resolve conflicts".

setup: |
  rm -rf /tmp/ageval/repo
  mkdir -p /tmp/ageval/repo && cd /tmp/ageval/repo
  git init && git config user.email "test@test.com" && git config user.name "Test"
  echo "version: 1.0" > config.yaml
  echo "port: 8080" > settings.ini
  git add -A && git commit -m "initial"

  git checkout -b feature
  echo "version: 2.0-feature" > config.yaml
  echo "port: 9090" > settings.ini
  git add -A && git commit -m "feature changes"

  git checkout main 2>/dev/null || git checkout master
  echo "version: 1.5-hotfix" > config.yaml
  echo "port: 8081" > settings.ini
  git add -A && git commit -m "hotfix"

  git merge feature || true

verify: |
  cd /tmp/ageval/repo
  # No conflict markers remaining
  ! grep -rq '<<<<<<' . 2>/dev/null
  # Merge is complete (no MERGE_HEAD)
  [ ! -f .git/MERGE_HEAD ]
  # Last commit message matches
  git log -1 --format=%s | grep -qi "merge.*resolve\|resolve.*conflict"

tools:
  - exec
