id: AG3
tier: 1
title: "Fix a JSON config typo"
difficulty: easy
time_limit: 120
max_steps: 10
min_steps: 3

goal: |
  The file /tmp/ageval/config.json has a typo: the key "prot" should be "port".
  Fix the typo without changing any values. Verify the JSON is valid after editing.

setup: |
  mkdir -p /tmp/ageval
  cat > /tmp/ageval/config.json << 'EOF'
  {
    "host": "0.0.0.0",
    "prot": 8080,
    "database": {
      "host": "localhost",
      "prot": 5432,
      "name": "myapp"
    },
    "debug": false
  }
  EOF

verify: |
  python3 -c "
  import json
  with open('/tmp/ageval/config.json') as f:
      d = json.load(f)
  assert 'port' in d, 'top-level port missing'
  assert 'prot' not in d, 'top-level prot still exists'
  assert d['port'] == 8080, 'port value wrong'
  assert 'port' in d['database'], 'database.port missing'
  assert 'prot' not in d['database'], 'database.prot still exists'
  assert d['database']['port'] == 5432, 'database.port value wrong'
  "

tools:
  - exec
