id: AG10
tier: 1
title: "Write and run a bash script"
difficulty: easy
time_limit: 120
max_steps: 10
min_steps: 3

goal: |
  Write a bash script at /tmp/ageval/disk-check.sh that:
  1. Gets the disk usage percentage of the root filesystem
  2. Writes "OK" to /tmp/ageval/disk-status.txt if usage is below 90%
  3. Writes "WARNING" if 90% or above
  Make it executable and run it.

setup: |
  mkdir -p /tmp/ageval
  rm -f /tmp/ageval/disk-check.sh /tmp/ageval/disk-status.txt

verify: |
  [ -x /tmp/ageval/disk-check.sh ] && [ -f /tmp/ageval/disk-status.txt ] && \
  grep -qE '^(OK|WARNING)$' /tmp/ageval/disk-status.txt

tools:
  - exec
