id: AG24
tier: 3
title: "Implement a CI pipeline"
difficulty: hard
time_limit: 600
max_steps: 50
min_steps: 6

goal: |
  Create a GitHub Actions workflow file at /tmp/ageval/project/.github/workflows/ci.yml
  for the Python project at /tmp/ageval/project/. The workflow should:
  1. Trigger on push and pull_request to main
  2. Have a job that runs on ubuntu-latest
  3. Steps: checkout, set up Python 3.11, install dependencies from requirements.txt,
     run linting with flake8, run tests with pytest, build a docker image
  The YAML must be syntactically valid.

setup: |
  rm -rf /tmp/ageval/project
  mkdir -p /tmp/ageval/project
  cat > /tmp/ageval/project/requirements.txt << 'EOF'
  flask==3.0.0
  pytest==7.4.0
  flake8==6.1.0
  EOF
  cat > /tmp/ageval/project/app.py << 'EOF'
  from flask import Flask
  app = Flask(__name__)

  @app.route("/")
  def hello():
      return "Hello World"
  EOF
  cat > /tmp/ageval/project/test_app.py << 'EOF'
  from app import app

  def test_hello():
      client = app.test_client()
      response = client.get("/")
      assert response.status_code == 200
  EOF
  cat > /tmp/ageval/project/Dockerfile << 'EOF'
  FROM python:3.11-slim
  WORKDIR /app
  COPY requirements.txt .
  RUN pip install -r requirements.txt
  COPY . .
  CMD ["python", "-m", "flask", "run"]
  EOF

verify: |
  WORKFLOW="/tmp/ageval/project/.github/workflows/ci.yml"
  [ -f "$WORKFLOW" ] && \
  # Validate YAML syntax
  python3 -c "import yaml; yaml.safe_load(open('$WORKFLOW'))" && \
  # Check trigger events
  grep -q "push" "$WORKFLOW" && \
  grep -q "pull_request" "$WORKFLOW" && \
  # Check ubuntu runner
  grep -q "ubuntu" "$WORKFLOW" && \
  # Check Python setup
  grep -q "python" "$WORKFLOW" && \
  grep -q "3.11\|3\.11" "$WORKFLOW" && \
  # Check required steps
  grep -q "checkout" "$WORKFLOW" && \
  grep -qi "flake8\|lint" "$WORKFLOW" && \
  grep -qi "pytest\|test" "$WORKFLOW" && \
  grep -qi "docker" "$WORKFLOW" && \
  grep -q "requirements" "$WORKFLOW"

tools:
  - exec
