id: AG1
tier: 1
title: "Create and verify a file"
difficulty: easy
time_limit: 120
max_steps: 10
min_steps: 2

goal: |
  Create a file at /tmp/ageval/hello.txt containing exactly "Hello World" (no trailing newline).
  Verify the file exists and contains the correct content.

setup: |
  mkdir -p /tmp/ageval
  rm -f /tmp/ageval/hello.txt

verify: |
  [ "$(cat /tmp/ageval/hello.txt 2>/dev/null)" = "Hello World" ]

tools:
  - exec
