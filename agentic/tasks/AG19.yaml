id: AG19
tier: 2
title: "Set up SSH key auth"
difficulty: medium
time_limit: 300
max_steps: 30
min_steps: 4

goal: |
  Set up SSH key-based authentication in /tmp/ageval/.ssh/:
  1. Generate an Ed25519 SSH key pair at /tmp/ageval/.ssh/id_ed25519 (no passphrase)
  2. Add the public key to /tmp/ageval/.ssh/authorized_keys
  3. Set correct permissions: 700 for .ssh directory, 600 for private key,
     644 for public key, 600 for authorized_keys

setup: |
  rm -rf /tmp/ageval
  mkdir -p /tmp/ageval

verify: |
  # Check key files exist
  [ -f /tmp/ageval/.ssh/id_ed25519 ] && \
  [ -f /tmp/ageval/.ssh/id_ed25519.pub ] && \
  [ -f /tmp/ageval/.ssh/authorized_keys ] && \
  # Check permissions
  [ "$(stat -c %a /tmp/ageval/.ssh)" = "700" ] && \
  [ "$(stat -c %a /tmp/ageval/.ssh/id_ed25519)" = "600" ] && \
  [ "$(stat -c %a /tmp/ageval/.ssh/authorized_keys)" = "600" ] && \
  # Check authorized_keys contains the public key
  PUB=$(cat /tmp/ageval/.ssh/id_ed25519.pub) && \
  grep -qF "$PUB" /tmp/ageval/.ssh/authorized_keys && \
  # Verify it's actually an ed25519 key
  grep -q "ssh-ed25519" /tmp/ageval/.ssh/id_ed25519.pub

tools:
  - exec
