id: AG16
tier: 2
title: "Write a systemd service unit"
difficulty: medium
time_limit: 300
max_steps: 30
min_steps: 5

goal: |
  Write a systemd service unit file for the binary at /tmp/ageval/myapp.
  The service should:
  - Run /tmp/ageval/myapp as a simple service
  - Listen on port 9090 (the binary handles this itself)
  - Restart on failure with a 5-second delay
  - Run as the current user
  Install the unit, start the service, and verify it is active.

setup: |
  mkdir -p /tmp/ageval
  cat > /tmp/ageval/myapp << 'PYEOF'
  #!/usr/bin/env python3
  from http.server import HTTPServer, BaseHTTPRequestHandler
  import signal, sys

  class Handler(BaseHTTPRequestHandler):
      def do_GET(self):
          self.send_response(200)
          self.end_headers()
          self.wfile.write(b"OK")
      def log_message(self, format, *args):
          pass

  def shutdown(sig, frame):
      sys.exit(0)

  signal.signal(signal.SIGTERM, shutdown)
  HTTPServer(("0.0.0.0", 9090), Handler).serve_forever()
  PYEOF
  chmod +x /tmp/ageval/myapp
  # Clean up any previous runs
  sudo systemctl stop ageval-myapp 2>/dev/null || true
  sudo rm -f /etc/systemd/system/ageval-myapp.service
  sudo systemctl daemon-reload

verify: |
  sudo systemctl is-active ageval-myapp | grep -q "^active$" && \
  grep -q "Restart=" /etc/systemd/system/ageval-myapp.service && \
  grep -q "RestartSec=" /etc/systemd/system/ageval-myapp.service && \
  curl -s http://127.0.0.1:9090/ | grep -q "OK"

tools:
  - exec
