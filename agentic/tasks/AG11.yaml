id: AG11
tier: 2
title: "Fix a broken Python application"
difficulty: medium
time_limit: 300
max_steps: 30
min_steps: 5

goal: |
  The Python app at /tmp/ageval/app/ crashes on startup. Diagnose the error,
  fix it, and verify the app runs successfully (it should print "Server ready").

setup: |
  rm -rf /tmp/ageval/app
  mkdir -p /tmp/ageval/app
  cat > /tmp/ageval/app/main.py << 'PYEOF'
  import json
  import os

  def load_config():
      config_path = os.environ.get("APP_CONFIG", "/tmp/ageval/app/config.json")
      with open(config_path) as f:
          return json.load(f)

  def main():
      config = load_config()
      port = config["port"]
      host = config["host"]
      print(f"Server ready on {host}:{port}")

  if __name__ == "__main__":
      main()
  PYEOF
  cat > /tmp/ageval/app/config.json << 'EOF'
  {
    "host": "0.0.0.0",
    "port": 8080,
    "workers": 4
  EOF

verify: |
  cd /tmp/ageval/app && python3 main.py 2>&1 | grep -q "Server ready"

tools:
  - exec
