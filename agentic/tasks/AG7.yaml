id: AG7
tier: 1
title: "Set up a Python virtualenv"
difficulty: easy
time_limit: 180
max_steps: 10
min_steps: 4

goal: |
  Create a Python virtual environment at /tmp/ageval/venv.
  Install the 'pyyaml' package in it.
  Verify the import works by running a test script.

setup: |
  rm -rf /tmp/ageval/venv
  mkdir -p /tmp/ageval

verify: |
  /tmp/ageval/venv/bin/python3 -c "import yaml; print(yaml.__version__)" 2>/dev/null

tools:
  - exec
