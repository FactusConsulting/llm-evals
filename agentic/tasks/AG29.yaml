id: AG29
tier: 3
title: "Implement infrastructure as code"
difficulty: hard
time_limit: 600
max_steps: 50
min_steps: 7

goal: |
  Write an OpenTofu/Terraform module at /tmp/ageval/infra/ that:
  1. Has a provider block for "null" (hashicorp/null)
  2. Defines variables: server_name (string), environment (string, default "dev")
  3. Creates a null_resource with a local-exec provisioner that writes
     "Server: <server_name>, Env: <environment>" to /tmp/ageval/infra/server_info.txt
  4. Has an output for the server_info_path (/tmp/ageval/infra/server_info.txt)
  5. Run `tofu init` and `tofu apply -auto-approve` with server_name="web01"
  Verify the module applies successfully and server_info.txt is created.

setup: |
  rm -rf /tmp/ageval/infra
  mkdir -p /tmp/ageval/infra

verify: |
  # Check file structure
  [ -f /tmp/ageval/infra/main.tf ] || [ -f /tmp/ageval/infra/resources.tf ] && \
  # Check variables file exists (or variables in main.tf)
  ([ -f /tmp/ageval/infra/variables.tf ] || grep -q "variable" /tmp/ageval/infra/main.tf) && \
  # Check outputs exist
  ([ -f /tmp/ageval/infra/outputs.tf ] || grep -q "output" /tmp/ageval/infra/main.tf) && \
  # Check terraform state exists (successful apply)
  [ -f /tmp/ageval/infra/terraform.tfstate ] && \
  # Check the provisioned file was created with correct content
  [ -f /tmp/ageval/infra/server_info.txt ] && \
  grep -q "web01" /tmp/ageval/infra/server_info.txt && \
  grep -qi "dev" /tmp/ageval/infra/server_info.txt

tools:
  - exec
