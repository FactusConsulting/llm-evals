id: AG6
tier: 1
title: "Extract error from log file"
difficulty: easy
time_limit: 120
max_steps: 10
min_steps: 2

goal: |
  Read /tmp/ageval/app.log and find the most recent ERROR line.
  Write the full timestamp of that line to /tmp/ageval/error-time.txt (format: YYYY-MM-DD HH:MM:SS).

setup: |
  mkdir -p /tmp/ageval
  cat > /tmp/ageval/app.log << 'EOF'
  2026-03-28 10:15:23 INFO  Application started on port 8080
  2026-03-28 10:15:24 INFO  Connected to database
  2026-03-28 10:22:01 WARN  High memory usage: 85%
  2026-03-28 10:30:45 ERROR Connection pool exhausted: max_connections=10, active=10, waiting=5
  2026-03-28 10:30:46 INFO  Recycling idle connections
  2026-03-28 10:45:12 ERROR Timeout waiting for database response after 30s
  2026-03-28 10:45:13 INFO  Retrying query with exponential backoff
  2026-03-28 11:00:00 INFO  Health check passed
  EOF

verify: |
  [ "$(cat /tmp/ageval/error-time.txt 2>/dev/null | tr -d '[:space:]')" = "2026-03-2810:45:12" ]

tools:
  - exec
