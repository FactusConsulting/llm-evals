id: AG23
tier: 3
title: "Debug a production incident from logs"
difficulty: hard
time_limit: 600
max_steps: 50
min_steps: 8

goal: |
  Three log files are at /tmp/ageval/logs/ (app.log, nginx.log, db.log). Correlate
  timestamps across the logs to find the root cause of the outage.
  The root cause is: the database connection pool was exhausted, causing connection
  timeouts, which cascaded into HTTP 502 errors at the nginx layer.
  Write a post-mortem summary to /tmp/ageval/postmortem.txt that includes:
  1. The root cause (database connection pool exhaustion / timeout)
  2. The timeline of events
  3. At least one remediation step

setup: |
  rm -rf /tmp/ageval/logs /tmp/ageval/postmortem.txt
  mkdir -p /tmp/ageval/logs

  cat > /tmp/ageval/logs/db.log << 'EOF'
  2026-03-28 10:00:01 [INFO] Database server started, max_connections=50
  2026-03-28 10:15:22 [INFO] Connection pool: 45/50 active
  2026-03-28 10:15:45 [WARN] Connection pool: 49/50 active - approaching limit
  2026-03-28 10:16:01 [ERROR] Connection pool exhausted: 50/50 active, 12 queued
  2026-03-28 10:16:03 [ERROR] Connection timeout for client 10.0.1.5: waited 30s
  2026-03-28 10:16:05 [ERROR] Connection timeout for client 10.0.1.5: waited 30s
  2026-03-28 10:16:08 [ERROR] Connection pool exhausted: 50/50 active, 28 queued
  2026-03-28 10:16:15 [ERROR] Connection timeout for client 10.0.1.5: waited 30s
  2026-03-28 10:16:30 [WARN] Long-running query detected: SELECT * FROM orders JOIN ... (45s)
  2026-03-28 10:17:00 [INFO] Connection pool: 32/50 active - recovering
  2026-03-28 10:20:00 [INFO] Connection pool: 10/50 active - normal
  EOF

  cat > /tmp/ageval/logs/app.log << 'EOF'
  2026-03-28 10:00:05 [INFO] Application started on port 3000
  2026-03-28 10:15:00 [INFO] Handling request: GET /api/orders
  2026-03-28 10:16:02 [ERROR] Database query failed: connection timeout after 30s
  2026-03-28 10:16:04 [ERROR] Database query failed: connection timeout after 30s
  2026-03-28 10:16:06 [ERROR] Failed to process request GET /api/orders: DB unavailable
  2026-03-28 10:16:06 [ERROR] Returning HTTP 500 for GET /api/orders
  2026-03-28 10:16:10 [ERROR] Database query failed: connection timeout after 30s
  2026-03-28 10:16:12 [ERROR] Health check /health failed: cannot reach database
  2026-03-28 10:16:20 [ERROR] Database query failed: connection timeout after 30s
  2026-03-28 10:17:05 [INFO] Database connection restored
  2026-03-28 10:17:10 [INFO] Health check /health passed
  EOF

  cat > /tmp/ageval/logs/nginx.log << 'EOF'
  2026-03-28 10:00:02 [INFO] nginx started, upstream: 127.0.0.1:3000
  2026-03-28 10:15:01 200 GET /api/orders 0.045s
  2026-03-28 10:16:05 502 GET /api/orders 30.012s
  2026-03-28 10:16:07 502 GET /api/orders 30.008s
  2026-03-28 10:16:12 502 GET /health 30.001s
  2026-03-28 10:16:15 502 GET /api/users 30.005s
  2026-03-28 10:16:20 502 GET /api/orders 30.010s
  2026-03-28 10:17:10 200 GET /health 0.003s
  2026-03-28 10:17:15 200 GET /api/orders 0.052s
  EOF

verify: |
  [ -f /tmp/ageval/postmortem.txt ] && \
  # Must mention database connection pool as root cause
  grep -qi "connection pool\|pool exhaust" /tmp/ageval/postmortem.txt && \
  # Must mention cascading / 502 / timeout
  grep -qi "502\|cascade\|timeout" /tmp/ageval/postmortem.txt && \
  # Must include a remediation
  grep -qi "remedia\|fix\|prevent\|recommend\|action\|mitiga\|increase.*pool\|pool.*size\|max.connection" /tmp/ageval/postmortem.txt && \
  # Must mention timeline or timestamps
  grep -qE "10:1[5-7]|timeline|sequence|chronolog" /tmp/ageval/postmortem.txt

tools:
  - exec
