id: AG22
tier: 3
title: "Create an Ansible role from scratch"
difficulty: hard
time_limit: 600
max_steps: 50
min_steps: 8

goal: |
  Create an Ansible role called "webserver" at /tmp/ageval/roles/webserver/ that:
  1. Has the standard role directory structure (tasks, templates, handlers, defaults, meta)
  2. tasks/main.yml installs nginx (apt), copies a config template, and enables the service
  3. templates/ contains an nginx.conf.j2 template using a variable for server_name
  4. defaults/main.yml defines default values for server_name and listen_port
  5. handlers/main.yml has a handler to restart nginx
  6. meta/main.yml has basic role metadata
  Verify the role structure passes ansible-lint basic checks (or at minimum,
  ansible-playbook --syntax-check on a test playbook using the role).

setup: |
  rm -rf /tmp/ageval/roles /tmp/ageval/test-playbook.yml
  mkdir -p /tmp/ageval/roles
  cat > /tmp/ageval/test-playbook.yml << 'EOF'
  ---
  - name: Test webserver role
    hosts: localhost
    connection: local
    gather_facts: false
    roles:
      - webserver
  EOF

verify: |
  # Check directory structure
  [ -d /tmp/ageval/roles/webserver/tasks ] && \
  [ -d /tmp/ageval/roles/webserver/templates ] && \
  [ -d /tmp/ageval/roles/webserver/handlers ] && \
  [ -d /tmp/ageval/roles/webserver/defaults ] && \
  [ -d /tmp/ageval/roles/webserver/meta ] && \
  # Check required files exist
  [ -f /tmp/ageval/roles/webserver/tasks/main.yml ] && \
  [ -f /tmp/ageval/roles/webserver/defaults/main.yml ] && \
  [ -f /tmp/ageval/roles/webserver/handlers/main.yml ] && \
  [ -f /tmp/ageval/roles/webserver/meta/main.yml ] && \
  # Check tasks reference nginx
  grep -q "nginx" /tmp/ageval/roles/webserver/tasks/main.yml && \
  # Check template exists and uses a variable
  ls /tmp/ageval/roles/webserver/templates/*.j2 >/dev/null 2>&1 && \
  grep -q "{{" /tmp/ageval/roles/webserver/templates/*.j2 && \
  # Check defaults define variables
  grep -q "server_name" /tmp/ageval/roles/webserver/defaults/main.yml && \
  grep -q "listen_port\|port" /tmp/ageval/roles/webserver/defaults/main.yml && \
  # Check handler exists
  grep -q "nginx" /tmp/ageval/roles/webserver/handlers/main.yml && \
  # Syntax check passes
  cd /tmp/ageval && ansible-playbook --syntax-check -i localhost, test-playbook.yml 2>&1 | grep -q "playbook: test-playbook.yml"

tools:
  - exec
