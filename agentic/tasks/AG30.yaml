id: AG30
tier: 3
title: "End-to-end incident response"
difficulty: hard
time_limit: 600
max_steps: 50
min_steps: 10

goal: |
  A broken environment at /tmp/ageval/incident/ has 3 issues that must be diagnosed
  and fixed:
  1. DNS: /tmp/ageval/incident/etc/hosts has the app domain "app.internal" pointing
     to the wrong IP (10.0.0.99 instead of 127.0.0.1)
  2. TLS: /tmp/ageval/incident/certs/server.crt contains "EXPIRED" in the subject -
     generate a new self-signed cert (valid for 365 days) for "app.internal"
  3. Firewall: /tmp/ageval/incident/firewall/rules.conf blocks port 443 (DENY 443) -
     change it to ALLOW 443
  After fixing all 3 issues, write a summary of what was found and fixed to
  /tmp/ageval/incident/resolution.txt.

setup: |
  rm -rf /tmp/ageval/incident
  mkdir -p /tmp/ageval/incident/etc
  mkdir -p /tmp/ageval/incident/certs
  mkdir -p /tmp/ageval/incident/firewall

  # Issue 1: Wrong DNS entry
  cat > /tmp/ageval/incident/etc/hosts << 'EOF'
  127.0.0.1 localhost
  10.0.0.99 app.internal
  10.0.0.5 db.internal
  EOF

  # Issue 2: Expired cert placeholder
  cat > /tmp/ageval/incident/certs/server.crt << 'EOF'
  -----BEGIN CERTIFICATE-----
  EXPIRED_CERTIFICATE_PLACEHOLDER
  Subject: CN=app.internal-EXPIRED
  Not After: Jan 01 00:00:00 2024 GMT
  -----END CERTIFICATE-----
  EOF

  # Issue 3: Firewall blocks HTTPS
  cat > /tmp/ageval/incident/firewall/rules.conf << 'EOF'
  ALLOW 22
  ALLOW 80
  DENY 443
  ALLOW 3000
  DENY 0:0
  EOF

verify: |
  # 1. DNS: app.internal points to 127.0.0.1
  grep -q "127.0.0.1.*app\.internal" /tmp/ageval/incident/etc/hosts && \
  ! grep -q "10.0.0.99.*app\.internal" /tmp/ageval/incident/etc/hosts && \
  # 2. Cert: no EXPIRED, valid cert exists
  ! grep -qi "EXPIRED" /tmp/ageval/incident/certs/server.crt && \
  openssl x509 -in /tmp/ageval/incident/certs/server.crt -noout -subject 2>/dev/null | grep -qi "app.internal" && \
  # 3. Firewall: port 443 is allowed
  grep -q "ALLOW 443" /tmp/ageval/incident/firewall/rules.conf && \
  ! grep -q "DENY 443" /tmp/ageval/incident/firewall/rules.conf && \
  # Resolution summary exists
  [ -f /tmp/ageval/incident/resolution.txt ] && \
  [ -s /tmp/ageval/incident/resolution.txt ]

tools:
  - exec
