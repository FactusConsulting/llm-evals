id: AG8
tier: 1
title: "Fix file permissions"
difficulty: easy
time_limit: 120
max_steps: 10
min_steps: 3

goal: |
  The script /tmp/ageval/deploy.sh has wrong permissions (777).
  It should be 750 (owner rwx, group rx, others none).
  Fix the permissions and verify.

setup: |
  mkdir -p /tmp/ageval
  echo '#!/bin/bash' > /tmp/ageval/deploy.sh
  echo 'echo "deploying..."' >> /tmp/ageval/deploy.sh
  chmod 777 /tmp/ageval/deploy.sh

verify: |
  [ "$(stat -c '%a' /tmp/ageval/deploy.sh 2>/dev/null)" = "750" ]

tools:
  - exec
