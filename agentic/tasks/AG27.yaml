id: AG27
tier: 3
title: "Write a monitoring check"
difficulty: hard
time_limit: 600
max_steps: 50
min_steps: 6

goal: |
  Write a bash script at /tmp/ageval/monitoring/check.sh that performs 4 checks:
  1. Disk usage of / - WARN if >80%, CRIT if >95%
  2. Memory usage - WARN if >80%, CRIT if >95%
  3. Load average (1 min) - WARN if > number of CPUs, CRIT if > 2x CPUs
  4. URL health check of http://127.0.0.1:9999/health - CRIT if not HTTP 200
  The script must output Nagios-compatible results:
  - Print a status line for each check
  - Exit 0 for OK, 1 for WARN, 2 for CRIT (use the worst result)
  Make the script executable. A test HTTP server will be running on port 9999.

setup: |
  rm -rf /tmp/ageval/monitoring
  mkdir -p /tmp/ageval/monitoring
  # Start a simple health endpoint
  pkill -f "python3.*9999" 2>/dev/null || true
  python3 -c "
  from http.server import HTTPServer, BaseHTTPRequestHandler
  class H(BaseHTTPRequestHandler):
      def do_GET(self):
          self.send_response(200)
          self.end_headers()
          self.wfile.write(b'ok')
      def log_message(self, *a): pass
  HTTPServer(('127.0.0.1', 9999), H).serve_forever()
  " &
  sleep 1

verify: |
  # Script must exist and be executable
  [ -x /tmp/ageval/monitoring/check.sh ] && \
  # Run the script and capture output and exit code
  OUTPUT=$(/tmp/ageval/monitoring/check.sh 2>&1) && \
  EXIT_CODE=$? && \
  # Exit code must be 0, 1, or 2
  [ "$EXIT_CODE" -le 2 ] && \
  # Output must mention all 4 checks
  echo "$OUTPUT" | grep -qi "disk" && \
  echo "$OUTPUT" | grep -qi "memory\|mem" && \
  echo "$OUTPUT" | grep -qi "load" && \
  echo "$OUTPUT" | grep -qi "health\|url\|http" && \
  # Output must contain OK/WARN/CRIT status labels
  echo "$OUTPUT" | grep -qiE "OK|WARN|CRIT"

tools:
  - exec
