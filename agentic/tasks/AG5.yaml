id: AG5
tier: 1
title: "Diagnose a failed service"
difficulty: easy
time_limit: 120
max_steps: 10
min_steps: 3

goal: |
  A systemd service "ageval-app" is failing. Check its status, find the error,
  and write the root cause to /tmp/ageval/diagnosis.txt.
  The diagnosis should mention the actual error (file not found, missing binary, etc).

setup: |
  mkdir -p /tmp/ageval
  sudo tee /etc/systemd/system/ageval-app.service > /dev/null << 'EOF'
  [Unit]
  Description=Ageval Test App

  [Service]
  Type=simple
  ExecStart=/usr/local/bin/ageval-app-nonexistent --port 8080
  Restart=no

  [Install]
  WantedBy=multi-user.target
  EOF
  sudo systemctl daemon-reload
  sudo systemctl start ageval-app || true

verify: |
  grep -qi "not found\|no such file\|missing\|nonexistent\|does not exist" /tmp/ageval/diagnosis.txt 2>/dev/null

tools:
  - exec
