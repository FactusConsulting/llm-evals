id: AG5
tier: 1
title: "Diagnose a failed service"
difficulty: easy
time_limit: 120
max_steps: 10
min_steps: 3

goal: |
  A systemd service "ageval-app" is failing. Check its status and journal logs,
  find the error, and write the root cause to /tmp/ageval/diagnosis.txt.
  The diagnosis should mention the actual error (missing binary, file not found, etc).

setup: |
  mkdir -p /tmp/ageval
  cat > /etc/systemd/system/ageval-app.service << 'EOF'
  [Unit]
  Description=Ageval Test App

  [Service]
  Type=simple
  ExecStart=/usr/local/bin/ageval-app-nonexistent --port 8080
  Restart=no

  [Install]
  WantedBy=multi-user.target
  EOF
  systemctl daemon-reload
  systemctl start ageval-app 2>/dev/null || true

verify: |
  grep -qi "not found\|no such file\|missing\|nonexistent\|does not exist\|executable.*not\|binary.*not" /tmp/ageval/diagnosis.txt 2>/dev/null

tools:
  - exec
