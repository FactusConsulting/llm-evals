id: AG5
tier: 1
title: "Diagnose a failed service from logs"
difficulty: easy
time_limit: 120
max_steps: 10
min_steps: 3

goal: |
  The application "ageval-app" failed to start. Logs are in /tmp/ageval/service.log
  and the service config is in /tmp/ageval/ageval-app.service.
  Read the logs and config, diagnose the root cause, and write your diagnosis
  to /tmp/ageval/diagnosis.txt. The diagnosis should identify the specific error.

setup: |
  mkdir -p /tmp/ageval
  cat > /tmp/ageval/ageval-app.service << 'EOF'
  [Unit]
  Description=Ageval Test App
  After=network.target

  [Service]
  Type=simple
  ExecStart=/usr/local/bin/ageval-app --port 8080 --config /etc/ageval/config.yaml
  Restart=on-failure
  User=appuser

  [Install]
  WantedBy=multi-user.target
  EOF
  cat > /tmp/ageval/service.log << 'EOF'
  Mar 29 10:00:01 eval-server systemd[1]: Starting Ageval Test App...
  Mar 29 10:00:01 eval-server systemd[1]: ageval-app.service: Failed to locate executable /usr/local/bin/ageval-app: No such file or directory
  Mar 29 10:00:01 eval-server systemd[1]: ageval-app.service: Failed at step EXEC spawning /usr/local/bin/ageval-app: No such file or directory
  Mar 29 10:00:01 eval-server systemd[1]: ageval-app.service: Main process exited, code=exited, status=203/EXEC
  Mar 29 10:00:01 eval-server systemd[1]: ageval-app.service: Failed with result 'exit-code'.
  Mar 29 10:00:01 eval-server systemd[1]: Failed to start Ageval Test App.
  Mar 29 10:00:06 eval-server systemd[1]: ageval-app.service: Scheduled restart job, restart counter is at 1.
  Mar 29 10:00:06 eval-server systemd[1]: Starting Ageval Test App...
  Mar 29 10:00:06 eval-server systemd[1]: ageval-app.service: Failed to locate executable /usr/local/bin/ageval-app: No such file or directory
  Mar 29 10:00:06 eval-server systemd[1]: ageval-app.service: Failed at step EXEC spawning /usr/local/bin/ageval-app: No such file or directory
  Mar 29 10:00:06 eval-server systemd[1]: ageval-app.service: Main process exited, code=exited, status=203/EXEC
  Mar 29 10:00:06 eval-server systemd[1]: ageval-app.service: Failed with result 'exit-code'.
  EOF

verify: |
  grep -qi "not found\|no such file\|missing\|executable\|does not exist\|binary\|203\|EXEC" /tmp/ageval/diagnosis.txt 2>/dev/null

tools:
  - exec
