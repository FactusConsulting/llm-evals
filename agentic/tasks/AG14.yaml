id: AG14
tier: 2
title: "Debug a multi-stage build failure"
difficulty: medium
time_limit: 300
max_steps: 30
min_steps: 5

goal: |
  The nginx config at /tmp/ageval/nginx/ returns 502 Bad Gateway because the upstream
  is misconfigured. Find the problem, fix the config, test it with nginx -t, and
  reload nginx. The upstream should point to 127.0.0.1:3000.

setup: |
  mkdir -p /tmp/ageval/nginx
  # Create a broken nginx config (wrong upstream port)
  cat > /tmp/ageval/nginx/app.conf << 'EOF'
  upstream backend {
      server 127.0.0.1:3001;  # Wrong port - should be 3000
  }

  server {
      listen 8888;
      server_name localhost;

      location / {
          proxy_pass http://backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
      }

      location /health {
          return 200 'ok';
          add_header Content-Type text/plain;
      }
  }
  EOF

verify: |
  grep -q '127.0.0.1:3000' /tmp/ageval/nginx/app.conf && \
  ! grep -q '127.0.0.1:3001' /tmp/ageval/nginx/app.conf

tools:
  - exec
