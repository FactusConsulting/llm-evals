# gitleaks policy for FactusConsulting/llm-evals.
#
# gitleaks discovers this file on its own, which means it REPLACES the workstation
# policy in ~/.config/gitleaks/gitleaks.toml for this repo. The default rule set is
# re-enabled below, so this file only ever adds allowances.
#
# Why this file is written the way it is: this repository has leaked a real
# credential before — llama-server API keys were hardcoded in results/*/run-chunk.sh
# and only removed from the tree in 259b7c2 (they are still in history). So the
# allowlists below cover eval *data* — one task's fixture values and machine-written
# model prose — and deliberately leave every script in scope.
#
# Note on `condition = "AND"`: `gitleaks dir` short-circuits on a matching `paths`
# entry before it evaluates `regexes`, so a path+regex allowlist is effectively
# path-only in that mode. The fixture allowlist below is therefore value-scoped with
# no `paths` at all, so it behaves identically in `gitleaks dir`, `gitleaks git` and
# the pre-commit hook.

title = "llm-evals eval-data allowlist"

[extend]
useDefault = true

[[allowlists]]
description = """
Fixture values from agentic task AG25 ("Migrate configuration"). The task writes a
fake /tmp/ageval/app.env and asks the model to base64-encode the sensitive entries
into a Kubernetes Secret, so the literals and their base64 forms appear in the task
definition and in every recorded transcript. Models that invent their own app.env
instead of reading the supplied one contribute a handful of extra placeholders; all
of those are listed here too. Every one of the 381 agentic findings traces to AG25.

Value-scoped, not path-scoped: these 19 strings are not credentials for anything
that exists, while a real key that ever lands in a transcript — a 64-hex
llama-server key, sk-ant-*, ghp_*, ... — is still reported.
"""
regexTarget = "secret"
regexes = [
  # AG25's API_KEY literal, plus the mistyped variants models reproduce
  '''^ak_live_[A-Za-z0-9]{12,20}$''',
  # the same fixture values base64-encoded into the Secret manifest
  '''^(YWtfbGl2ZV83|YWJj|MTIzNDU|c3VwZX[IJ]|c2VjcmV0|czNjcmV0|cDNyZWN0|bXl2ZXJ5|bXktdmVyeS1)[A-Za-z0-9+/]*={0,2}$''',
  # plaintext fixture and model-invented placeholders
  '''^(abcdef123456|abc123xyz789|12345-abcde)$''',
  '''^(myverysecretkey|my-very-secret-key|super-secret-key-12345)$''',
  '''^(supersecretpassword|supersecretpassword123)$''',
  '''^(s3cret_p@ssw0rd!|secret_p@ssw0rd!|p3rect_passw0rd!)$''',
]

[[allowlists]]
description = """
Knowledge-eval artifacts: raw model answers (chunkN-response.txt,
chunkN-scenarios.txt) and judge rating files (chunkN-ratings*.json). These are
free-form prose about security topics, so generic-api-key occasionally fires on a
fragment such as "Bastion/jump", "Phishing/Supply" or "keys-in-URL=API8". Nothing in
these files is written by hand and the harness records no credentials in them — only
the model URL.

Restricted to those three filename shapes on purpose: run-chunk.sh, send-chunk.sh and
run-splits.sh live in the very same results/<model>/ directories and are exactly
where the real API keys leaked, so they stay in scope.
"""
paths = [
  '''(^|/)results/.*/chunk[0-9]+-(response|scenarios)\.txt$''',
  '''(^|/)results/.*/chunk[0-9]+-ratings[^/]*\.json$''',
]
