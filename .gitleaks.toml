# gitleaks policy for FactusConsulting/llm-evals.
#
# gitleaks discovers this file on its own, which means it REPLACES the workstation
# policy in ~/.config/gitleaks/gitleaks.toml for this repo. The default rule set is
# re-enabled below, so this file only ever adds allowances.
#
# Why this file is written the way it is: this repository has leaked a real
# credential before — llama-server API keys were hardcoded in results/*/run-chunk.sh
# and only removed from the tree in 259b7c2 (they are still in history). So the
# allowlists below cover eval *data* — one task's fixture values and machine-written
# model prose — and deliberately leave every script in scope.
#
# Note on `paths`: a `paths` entry in a global allowlist is a whole-file skip applied by
# the directory walker BEFORE any rule runs -- not a filter on matching findings.
# `condition = "AND"` does not narrow it; the path pre-filter wins. A file it matches is
# invisible to every rule, so a real secret added there later is never reported. Measured:
# path-scoping the knowledge-eval artifacts made a `gitleaks dir` read 22 MB of this repo
# instead of 56 MB, and a planted API key, GitHub PAT and RSA private key inside one of
# those files all went unreported.
#
# So nothing here uses `paths`. Every allowlist is scoped to the reported SECRET and
# anchored end to end, which behaves identically in `gitleaks dir`, `gitleaks git` and the
# pre-commit hook, and cannot hide anything but the exact string it names.

title = "llm-evals eval-data allowlist"

[extend]
useDefault = true

[[allowlists]]
description = """
Fixture values from agentic task AG25 ("Migrate configuration"). The task writes a fake
/tmp/ageval/app.env and asks the model to base64-encode the sensitive entries into a
Kubernetes Secret, so the literals and their base64 forms appear in the task definition
and in every recorded transcript. Models that invent their own app.env instead of reading
the supplied one contribute a handful of extra placeholders; all of those are listed too.
Every agentic finding in this repo traces to AG25.

Enumerated exactly, not shaped. A pattern like ^ak_live_[A-Za-z0-9]{12,20}$ would excuse
ANY key of that shape, and ak_live_ is a plausible prefix for a real one; the base64
variant was worse, accepting arbitrarily long values behind a short prefix. These are the
19 strings that actually occur, so nothing else can hide behind them.

Ten of the nineteen occur on this branch. The other nine come from eval runs not yet in
main and are listed so the scan does not start failing when those results land. A twentieth
value means a new model invented a new placeholder: add it here, deliberately, having
looked at it.
"""
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  # AG25's API_KEY literal, plus the mistyped variants models reproduce
  '''^ak_live_7f8g9h0j1k2l3m4n$''',
  '''^ak_live_7f8g9h0j1k2l34n$''',
  '''^ak_live_7f8g9ho1k2s3m4n$''',
  # the same values base64-encoded into the Secret manifest
  '''^YWtfbGl2ZV83ZjhnOWgwajFrMmwzbTRu$''',
  '''^YWtfbGl2ZV83ZjhnOWgwajFrMmwzNG4=$''',
  '''^YWtfbGl2ZV83ZjhnOWhvMWsyczNtNG4=$''',
  # plaintext fixture and model-invented placeholders
  '''^abcdef123456$''',
  '''^abc123xyz789$''',
  '''^myverysecretkey$''',
  '''^my-very-secret-key$''',
  '''^supersecretpassword$''',
  '''^supersecretpassword123$''',
  # and their base64 forms
  '''^YWJjZGVmMTIzNDU2$''',
  '''^YWJjMTIzeHl6Nzg5$''',
  '''^MTIzNDUtYWJjZGU=$''',
  '''^bXl2ZXJ5c2VjcmV0a2V5$''',
  '''^bXktdmVyeS1zZWNyZXQta2V5$''',
  '''^c3VwZXJzZWNyZXRwYXNzd29yZA==$''',
  '''^c3VwZXJzZWNyZXRwYXNzd29yZDEyMw==$''',
  '''^c3VwZXItc2VjcmV0LWtleS0xMjM0NQ==$''',
  '''^c2VjcmV0X3BAc3N3MHJkIQ==$''',
  '''^czNjcmV0X3BAc3N3MHJkIQ==$''',
  '''^cDNyZWN0X3Bhc3N3MHJkIQ==$''',
]

[[allowlists]]
description = """
Knowledge-eval artifacts: raw model answers (chunkN-response.txt, chunkN-scenarios.txt)
and judge rating files (chunkN-ratings*.json). These are free-form prose about security
topics, so generic-api-key occasionally fires on a slash- or equals-joined fragment.
Three such fragments exist across the eval corpus, and they are named individually rather
than excused by location.

Dormant on this branch -- the runs that contain them are not in main yet -- which is
precisely why the entries are anchored: a dormant allowlist that could suppress a value
is the kind nobody re-reads before it starts to matter.

Named, not path-scoped, and that is the important part. Allowlisting those filename
shapes hides the files from every rule, and they are machine-written transcripts of a
model being asked about credentials, which is exactly where a real key can turn up.
run-chunk.sh, send-chunk.sh and run-splits.sh sit in the same results/<model>/
directories and are where this repo leaked real llama-server keys before. Three anchored
strings cost nothing and leave the corpus fully scanned: with the filename shapes
allowlisted, a `gitleaks dir` read 22 MB of the eval branch instead of 56 MB, and a
planted API key, GitHub PAT and RSA private key inside one of those files all went
unreported.
"""
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^Bastion/jump$''',
  '''^Phishing/Supply$''',
  '''^keys-in-URL=API8$''',
]

[[allowlists]]
description = """
Ansible/Vault variable names, not secrets -- the estate-wide floor, restated because a
repo-local config REPLACES ~/.config/gitleaks/gitleaks.toml rather than extending it. A
credential referenced as vault_<consumer>_(api_key|password|token|secret) is resolved
from Vault at render time; only the identifier ever appears in git. This repo has 18 such
references. Anchored against the reported secret, so a real value
assigned to one of those names is still reported.
"""
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^vault_[a-z0-9_]*_(api_key|password|token|secret)$''',
]

# ── Vault tokens ──────────────────────────────────────────────────────────────
# Carried forward from the workstation policy for the same reason as the allowlist above.
# The default ruleset has no rule for Vault tokens. Prefixes are Vault's own: hvs
# (service), hvb (batch), hvr (recovery), hvu (unwrapping).

[[rules]]
id = "vault-token"
description = "HashiCorp Vault token"
regex = '''\bhv[sbru]\.[A-Za-z0-9_-]{22,}'''
keywords = ["hvs.", "hvb.", "hvr.", "hvu."]
