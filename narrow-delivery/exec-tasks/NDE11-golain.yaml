id: NDE11-golain
title: "Fix a Go logic bug"
max_steps: 14
goal: |
  The Go package in /tmp/nd/golain has a failing test — IsLeapYear returns wrong results for
  some years. Fix the logic so the tests pass. Do not change the test file or the function
  signature. Verify with the tests before finishing.
setup: |
  rm -rf /tmp/nd/golain && mkdir -p /tmp/nd/golain
  printf 'module nd/leap\ngo 1.22\n' > /tmp/nd/golain/go.mod
  cat > /tmp/nd/golain/leap.go <<'EOF'
  package leap
  func IsLeapYear(y int) bool { return y%4 == 0 }
  EOF
  cat > /tmp/nd/golain/leap_test.go <<'EOF'
  package leap
  import "testing"
  func TestLeap(t *testing.T) {
  	cases := map[int]bool{2000:true, 1900:false, 2024:true, 2023:false, 2100:false, 2400:true}
  	for y, want := range cases {
  		if IsLeapYear(y) != want { t.Errorf("IsLeapYear(%d)=%v want %v", y, IsLeapYear(y), want) }
  	}
  }
  EOF
  # Stash a pristine copy: verify restores it before running the suite, so a model
  # cannot pass by gutting leap_test.go instead of fixing the code.
  mkdir -p /tmp/nd/.golden/golain && cp /tmp/nd/golain/leap_test.go /tmp/nd/.golden/golain/leap_test.go
verify: |
  cp /tmp/nd/.golden/golain/leap_test.go /tmp/nd/golain/leap_test.go
  cd /tmp/nd/golain && go test ./... >/dev/null 2>&1 && grep -qE 'func IsLeapYear\(y int\) bool' leap.go
tools: [exec]
