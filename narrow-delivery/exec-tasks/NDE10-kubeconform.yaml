id: NDE10-kubeconform
title: "Fix a k8s manifest that fails validation"
max_steps: 14
goal: |
  The Kubernetes manifest at /tmp/nd/k8s/deploy.yaml fails schema validation
  (`kubeconform`). Fix it so it validates. Verify before finishing. It should remain a
  Deployment named "web" with one nginx container and 2 replicas.
setup: |
  rm -rf /tmp/nd/k8s && mkdir -p /tmp/nd/k8s
  cat > /tmp/nd/k8s/deploy.yaml <<'EOF'
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: web
  spec:
    replicas: "2"
    selector:
      matchLabels: { app: web }
    template:
      metadata:
        labels: { app: web }
      spec:
        containers:
          - name: nginx
            image: nginx:1.27
  EOF
verify: |
  kubeconform /tmp/nd/k8s/deploy.yaml >/dev/null 2>&1 \
    && grep -qE 'replicas: 2$|replicas: 2 ' /tmp/nd/k8s/deploy.yaml
tools: [exec]
