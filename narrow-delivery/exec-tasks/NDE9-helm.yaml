id: NDE9-helm
title: "Fix helm values so the chart templates"
max_steps: 16
goal: |
  The Helm chart in /tmp/nd/helm/mychart fails to render with its values.yaml —
  `helm template /tmp/nd/helm/mychart` errors. Fix values.yaml so the chart renders. Verify
  with helm before finishing. Do not edit the templates, only values.yaml.
setup: |
  rm -rf /tmp/nd/helm && mkdir -p /tmp/nd/helm/mychart/templates
  cat > /tmp/nd/helm/mychart/Chart.yaml <<'EOF'
  apiVersion: v2
  name: mychart
  version: 0.1.0
  EOF
  cat > /tmp/nd/helm/mychart/values.yaml <<'EOF'
  replicaCount: "two"
  image:
    repository: nginx
  EOF
  cat > /tmp/nd/helm/mychart/templates/deploy.yaml <<'EOF'
  apiVersion: apps/v1
  kind: Deployment
  metadata: { name: {{ .Release.Name }} }
  spec:
    replicas: {{ .Values.replicaCount | int }}
    template:
      spec:
        containers:
          - name: app
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  EOF
verify: |
  helm template /tmp/nd/helm/mychart 2>/dev/null | grep -qE 'replicas: [0-9]+' \
    && helm template /tmp/nd/helm/mychart 2>/dev/null | grep -qE 'image: "nginx:[^"]+"'
tools: [exec]
