id: NDE2-kfix
title: "Fix a broken kustomization (monitoring is down)"
max_steps: 14
goal: |
  The Flux kustomization in /tmp/nd/kfix fails to build, so Flux cannot reconcile any
  of this directory's monitoring. Find out why and fix it so the directory builds
  cleanly. Verify it builds before you finish. Do not delete working alerts.
setup: |
  rm -rf /tmp/nd/kfix && mkdir -p /tmp/nd/kfix/sub
  cat > /tmp/nd/kfix/kustomization.yaml <<'EOF'
  apiVersion: kustomize.config.k8s.io/v1beta1
  kind: Kustomization
  resources:
    - gpu-alerts.yaml
    - librechat-alerts.yaml
  EOF
  cat > /tmp/nd/kfix/gpu-alerts.yaml <<'EOF'
  apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata: { name: gpu-alerts, namespace: observability }
  spec: { groups: [] }
  EOF
  # librechat-alerts.yaml is referenced but actually lives in sub/ — the #543 bug
  cat > /tmp/nd/kfix/sub/librechat-alerts.yaml <<'EOF'
  apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata: { name: librechat-alerts, namespace: observability }
  spec: { groups: [] }
  EOF
verify: |
  # Both alerts must survive. Checking only gpu-alerts let a model "fix" the build by
  # deleting librechat-alerts.yaml from resources — it builds, but that is exactly the
  # "Do not delete working alerts" violation the task is about.
  out=$(kustomize build /tmp/nd/kfix 2>/dev/null) \
    && echo "$out" | grep -q 'gpu-alerts' \
    && echo "$out" | grep -q 'librechat-alerts'
tools: [exec]
