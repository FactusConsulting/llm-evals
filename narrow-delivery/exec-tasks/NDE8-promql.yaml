id: NDE8-promql
title: "Fix an invalid PrometheusRule"
max_steps: 14
goal: |
  The PrometheusRule at /tmp/nd/promql/rule.yaml has an alert whose PromQL expression is
  invalid — `promtool check rules` fails on it. Fix the expression so the rules check passes,
  keeping the intent (fire when a Flux Ready condition is False). Verify with promtool before
  finishing.
setup: |
  rm -rf /tmp/nd/promql && mkdir -p /tmp/nd/promql
  cat > /tmp/nd/promql/rule.yaml <<'EOF'
  groups:
    - name: flux
      rules:
        - alert: FluxReconciliationStuck
          expr: sum by (name) (gotk_reconcile_condition{type="Ready" status="False"}) > 0
          for: 15m
          labels: { severity: warning }
          annotations: { summary: "Flux stuck" }
  EOF
verify: |
  promtool check rules /tmp/nd/promql/rule.yaml >/dev/null 2>&1
tools: [exec]
