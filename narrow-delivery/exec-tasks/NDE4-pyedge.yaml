id: NDE4-pyedge
title: "Fix a Python function so its tests pass"
max_steps: 14
goal: |
  parse_duration in /tmp/nd/pyedge/dateparse.py fails some of its tests. Make all the
  tests pass WITHOUT changing the test file. Verify the tests pass before finishing.
setup: |
  rm -rf /tmp/nd/pyedge && mkdir -p /tmp/nd/pyedge
  cat > /tmp/nd/pyedge/dateparse.py <<'EOF'
  import re
  _UNIT = {"h": 3600, "m": 60, "s": 1}
  def parse_duration(s):
      total = 0
      for v, u in re.findall(r"(\d+)([hms])", s):
          total += int(v) * _UNIT[u]
      return total
  EOF
  cat > /tmp/nd/pyedge/test_dateparse.py <<'EOF'
  from dateparse import parse_duration
  def test_existing():
      assert parse_duration("1h30m") == 5400
      assert parse_duration("45m") == 2700
      assert parse_duration("2h") == 7200
      assert parse_duration("90s") == 90
  def test_edges():
      assert parse_duration("") == 0
      assert parse_duration("120") == 120
  EOF
  # Stash a pristine copy: verify restores it before running the suite, so a model
  # cannot pass by gutting test_dateparse.py instead of fixing the code.
  mkdir -p /tmp/nd/.golden/pyedge && cp /tmp/nd/pyedge/test_dateparse.py /tmp/nd/.golden/pyedge/test_dateparse.py
verify: |
  cp /tmp/nd/.golden/pyedge/test_dateparse.py /tmp/nd/pyedge/test_dateparse.py
  cd /tmp/nd/pyedge && python3 -m pytest -q test_dateparse.py >/dev/null 2>&1
tools: [exec]
