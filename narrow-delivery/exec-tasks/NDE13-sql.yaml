id: NDE13-sql
title: "Fix a SQL query that returns the wrong result"
max_steps: 14
goal: |
  /tmp/nd/sql/query.sql is supposed to return, from the orders table, each customer and their
  TOTAL order amount, for customers whose total exceeds 100, ordered by total descending. It
  currently returns the wrong result. Fix query.sql. Verify by running it against the db
  (/tmp/nd/sql/shop.db) before finishing. Do not change the schema or data.
setup: |
  rm -rf /tmp/nd/sql && mkdir -p /tmp/nd/sql
  sqlite3 /tmp/nd/sql/shop.db "CREATE TABLE orders(customer TEXT, amount INT);
  INSERT INTO orders VALUES('alice',60),('alice',70),('bob',50),('carol',200),('bob',40);"
  cat > /tmp/nd/sql/query.sql <<'EOF'
  SELECT customer, amount FROM orders WHERE amount > 100 ORDER BY amount;
  EOF
verify: |
  out=$(sqlite3 /tmp/nd/sql/shop.db < /tmp/nd/sql/query.sql 2>/dev/null | tr '\n' ';')
  [ "$out" = "carol|200;alice|130;" ]
tools: [exec]
