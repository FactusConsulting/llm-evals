id: NDE12-pycrash
title: "Fix a Python function that crashes on edge input"
max_steps: 14
goal: |
  average() in /tmp/nd/pycrash/stats.py crashes on some inputs that the tests exercise. Make
  all the tests pass without changing the test file. Verify before finishing.
setup: |
  rm -rf /tmp/nd/pycrash && mkdir -p /tmp/nd/pycrash
  cat > /tmp/nd/pycrash/stats.py <<'EOF'
  def average(nums):
      return sum(nums) / len(nums)
  EOF
  cat > /tmp/nd/pycrash/test_stats.py <<'EOF'
  from stats import average
  def test_basic(): assert average([2, 4, 6]) == 4
  def test_empty(): assert average([]) == 0
  def test_single(): assert average([5]) == 5
  EOF
  # Stash a pristine copy: verify restores it before running the suite, so a model
  # cannot pass by gutting test_stats.py instead of fixing the code.
  mkdir -p /tmp/nd/.golden/pycrash && cp /tmp/nd/pycrash/test_stats.py /tmp/nd/.golden/pycrash/test_stats.py
verify: |
  cp /tmp/nd/.golden/pycrash/test_stats.py /tmp/nd/pycrash/test_stats.py
  cd /tmp/nd/pycrash && python3 -m pytest -q test_stats.py >/dev/null 2>&1
tools: [exec]
