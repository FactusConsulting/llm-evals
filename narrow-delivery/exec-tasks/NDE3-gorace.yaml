id: NDE3-gorace
title: "Fix a Go concurrency bug"
max_steps: 14
goal: |
  The Go package in /tmp/nd/gorace has a concurrency bug — running the tests with the
  race detector fails. Fix the bug. Do NOT change the test file, and do NOT change the
  public API (the Counter type and its Inc() and Value() int methods must keep the same
  names and signatures). Verify the tests pass under the race detector before finishing.
setup: |
  rm -rf /tmp/nd/gorace && mkdir -p /tmp/nd/gorace
  cat > /tmp/nd/gorace/go.mod <<'EOF'
  module nd/counter
  go 1.22
  EOF
  cat > /tmp/nd/gorace/counter.go <<'EOF'
  package counter
  type Counter struct{ n int }
  func (c *Counter) Inc()      { c.n++ }
  func (c *Counter) Value() int { return c.n }
  EOF
  cat > /tmp/nd/gorace/counter_test.go <<'EOF'
  package counter
  import ("sync"; "testing")
  func TestConcurrentInc(t *testing.T) {
  	c := &Counter{}; var wg sync.WaitGroup
  	for i := 0; i < 50; i++ { wg.Add(1); go func(){ defer wg.Done(); for j:=0;j<1000;j++ { c.Inc() } }() }
  	wg.Wait()
  	if c.Value() != 50000 { t.Fatalf("got %d want 50000", c.Value()) }
  }
  EOF
  # Stash a pristine copy: verify restores it before running the suite, so a model
  # cannot pass by gutting counter_test.go instead of fixing the code.
  mkdir -p /tmp/nd/.golden/gorace && cp /tmp/nd/gorace/counter_test.go /tmp/nd/.golden/gorace/counter_test.go
verify: |
  cp /tmp/nd/.golden/gorace/counter_test.go /tmp/nd/gorace/counter_test.go
  cd /tmp/nd/gorace && go test -race ./... >/dev/null 2>&1 \
    && grep -qE 'func \(c \*Counter\) Inc\(\)' counter.go \
    && grep -qE 'func \(c \*Counter\) Value\(\) int' counter.go
tools: [exec]
