id: NDE7-systemd
title: "Fix an invalid systemd unit"
max_steps: 14
goal: |
  The systemd unit at /tmp/nd/systemd/app.service is invalid — `systemd-analyze verify` reports
  errors. Fix it so it verifies clean. Verify before finishing. It should remain a simple
  service that runs /usr/bin/myapp and restarts on failure.
setup: |
  rm -rf /tmp/nd/systemd && mkdir -p /tmp/nd/systemd
  cat > /tmp/nd/systemd/app.service <<'EOF'
  [Unit]
  Description=My App
  After=network.target

  [Service]
  Type=simpel
  ExecStart=/usr/bin/myapp
  Restart=on-failures

  [Install]
  WantedBy=multi-user.target
  EOF
verify: |
  # Diagnostics alone are not enough: deleting the bad `Restart=on-failures` line also
  # silences the warning, so the unit "passes" while losing the restart behaviour the
  # task requires. Assert the corrected directives are actually present.
  u=/tmp/nd/systemd/app.service
  grep -qE '^\s*Restart\s*=\s*on-failure\s*$' "$u" || exit 1
  grep -qE '^\s*Type\s*=\s*simple\s*$' "$u" || exit 1
  grep -qE '^\s*ExecStart\s*=\s*/usr/bin/myapp\s*$' "$u" || exit 1
  systemd-analyze verify "$u" 2>&1 | grep -qiE 'Type|Restart' && exit 1
  systemd-analyze verify "$u" 2>&1 | grep -qiE 'error|invalid|unknown' && exit 1 || exit 0
tools: [exec]
