id: NDE6-bash
title: "Fix a buggy bash script"
max_steps: 14
goal: |
  /tmp/nd/bash/count.sh is meant to print the number of *.log files in a directory given
  as $1, and print 0 for an empty/missing directory. It currently misbehaves and shellcheck
  flags it. Fix it so it is shellcheck-clean AND returns the right counts. Verify both before
  finishing. Keep the interface (takes the directory as $1, prints just the number).
setup: |
  rm -rf /tmp/nd/bash && mkdir -p /tmp/nd/bash/data
  touch /tmp/nd/bash/data/a.log /tmp/nd/bash/data/b.log /tmp/nd/bash/data/c.txt
  cat > /tmp/nd/bash/count.sh <<'EOF'
  #!/bin/bash
  dir=$1
  count=`ls $dir/*.log | wc -l`
  echo $count
  EOF
  chmod +x /tmp/nd/bash/count.sh
verify: |
  shellcheck /tmp/nd/bash/count.sh >/dev/null 2>&1 \
    && [ "$(bash /tmp/nd/bash/count.sh /tmp/nd/bash/data)" = "2" ] \
    && [ "$(bash /tmp/nd/bash/count.sh /tmp/nd/bash/nonexistent)" = "0" ]
tools: [exec]
