id: NDE1-wire
title: "Make Flux deploy a new manifest"
max_steps: 14
goal: |
  In /tmp/nd/wire there is a Flux kustomization and a NEW file flux-podmonitor.yaml
  that is supposed to be deployed but currently is NOT picked up by Flux. Make it be
  deployed. Verify your change actually works by building the kustomization yourself
  and confirming the PodMonitor is in the output, before you finish.
setup: |
  rm -rf /tmp/nd/wire && mkdir -p /tmp/nd/wire
  cat > /tmp/nd/wire/kustomization.yaml <<'EOF'
  apiVersion: kustomize.config.k8s.io/v1beta1
  kind: Kustomization
  resources:
    - existing-alert.yaml
  EOF
  cat > /tmp/nd/wire/existing-alert.yaml <<'EOF'
  apiVersion: monitoring.coreos.com/v1
  kind: PrometheusRule
  metadata: { name: existing, namespace: observability }
  spec: { groups: [] }
  EOF
  cat > /tmp/nd/wire/flux-podmonitor.yaml <<'EOF'
  apiVersion: monitoring.coreos.com/v1
  kind: PodMonitor
  metadata: { name: flux-controllers, namespace: observability }
  spec: { selector: { matchLabels: { app: flux } }, podMetricsEndpoints: [{ port: http-prom }] }
  EOF
verify: |
  kustomize build /tmp/nd/wire 2>/dev/null | grep -q 'kind: PodMonitor'
tools: [exec]
