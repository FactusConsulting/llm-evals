id: NDE5-nginx
title: "Fix a broken nginx config"
max_steps: 14
goal: |
  The nginx config at /tmp/nd/nginx/test.conf is invalid — `nginx -t` against it fails.
  Fix it so the config tests clean. Verify with nginx before you finish. Do not change
  the intended behaviour (a server on port 8088 proxying /api to 127.0.0.1:3000).
setup: |
  rm -rf /tmp/nd/nginx && mkdir -p /tmp/nd/nginx
  cat > /tmp/nd/nginx/test.conf <<'EOF'
  events {}
  http {
    server {
      listen 8088;
      location /api {
        proxy_pass http://127.0.0.1:3000
      }
    }
  }
  EOF
verify: |
  nginx -t -c /tmp/nd/nginx/test.conf 2>&1 | grep -q 'syntax is ok' \
    && grep -q 'proxy_pass http://127.0.0.1:3000' /tmp/nd/nginx/test.conf
tools: [exec]
