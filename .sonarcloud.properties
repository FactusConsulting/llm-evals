# SonarCloud (Automatic Analysis) scope for the llm-evals repo.
#
# Exclude eval DATA + throwaway eval-helper scripts — they are not security-
# relevant source. The agentic/knowledge RESULT JSONs contain the models'
# GENERATED example configs for DevOps tasks (e.g. DB_PASSWORD=s3cret_p@ssw0rd!,
# API_KEY=ak_live_..., SECRET_KEY=...), which trip the hard-coded-secret rules
# (json/yaml:S6418 + S2068) as false positives — 28 of the 31 reported vulns.
# Verified 2026-06-09: NO real credential is committed — the live ai-infer API
# keys (e9f2a993…, 17e08dbd3a…, etc.) appear in NO result file; the harness
# passes keys via env/header, never logs them.
#
# The remaining python:S5443 ("/tmp is publicly writable") are in two one-off
# eval-helper scripts using /tmp safely — excluded here too. The core harness
# (harness.py, judge-knowledge.py, evaluate-chunk.py, run-*.sh) is still scanned.
sonar.exclusions=**/results/**,external/**,**/answers/**,**/chunks/**,**/*-response.txt,convert_csv_to_json.py,fix_typo.py
